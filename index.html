<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile Gesture Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; z-index: 20; pointer-events: none; }
        
        /* The Start Button is necessary for Mobile Chrome */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; justify-content: center;
            align-items: center; z-index: 100;
        }
        button {
            padding: 15px 30px; font-size: 18px; cursor: pointer;
            background: #00ffcc; border: none; border-radius: 5px; font-weight: bold;
        }
        #video-debug { 
            position: absolute; bottom: 10px; right: 10px; 
            width: 120px; height: 90px; border: 1px solid #00ffcc; 
            z-index: 10; transform: scaleX(-1); border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <button id="start-btn">ENABLE CAMERA & START</button>
    </div>

    <div id="ui">
        <div id="status">Waiting for input...</div>
        <div id="gesture-name" style="font-size: 24px; color: #00ffcc;"></div>
    </div>

    <video id="video-debug" autoplay playsinline></video>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        const videoElement = document.getElementById('video-debug');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const statusDiv = document.getElementById('status');

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false }); // Disable antialias for mobile performance
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        camera.position.z = 15;

        // --- Particles ---
        const particleCount = 4000; // Lower count for mobile performance
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(particleCount * 3);
        const targets = new Float32Array(particleCount * 3);
        for(let i=0; i<particleCount*3; i++) pos[i] = targets[i] = (Math.random()-0.5)*20;
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const mat = new THREE.PointsMaterial({ color: 0x00ffcc, size: 0.1, blending: THREE.AdditiveBlending });
        const points = new THREE.Points(geo, mat);
        scene.add(points);

        // --- MediaPipe Setup ---
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5 }); // Complexity 0 is faster for mobile

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusDiv.innerText = "Hand Detected";
                const hand = results.multiHandLandmarks[0];
                
                // Track Index Finger
                const x = (hand[8].x - 0.5) * -25;
                const y = (hand[8].y - 0.5) * -25;
                points.position.lerp(new THREE.Vector3(x, y, 0), 0.2);

                // Simple Gesture: Distance 4 to 8
                const dist = Math.hypot(hand[4].x - hand[8].x, hand[4].y - hand[8].y);
                if(dist < 0.06) {
                    document.getElementById('gesture-name').innerText = "PINCH";
                    mat.color.setHex(0xff0066);
                } else {
                    document.getElementById('gesture-name').innerText = "OPEN";
                    mat.color.setHex(0x00ffcc);
                }
            } else {
                statusDiv.innerText = "Scanning for hand...";
            }
        });

        // --- Start Trigger ---
        startBtn.onclick = () => {
            overlay.style.display = 'none';
            const cameraHelper = new Camera(videoElement, {
                onFrame: async () => { await hands.send({image: videoElement}); },
                width: 480, height: 360 // Lower resolution for faster mobile processing
            });
            cameraHelper.start().catch(err => {
                alert("Camera Error: Ensure you are on HTTPS and allowed permissions.");
                console.error(err);
            });
        };

        function animate() {
            requestAnimationFrame(animate);
            points.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
