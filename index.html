<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gemini Live Audio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    background: #0b0b0b;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
}

button {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: none;
    background: #1e90ff;
    color: white;
    font-size: 16px;
    cursor: pointer;
    position: relative;
    outline: none;
}

button.listening {
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0% {
        box-shadow: 0 0 0 0 rgba(30,144,255,0.7);
    }
    70% {
        box-shadow: 0 0 0 30px rgba(30,144,255,0);
    }
    100% {
        box-shadow: 0 0 0 0 rgba(30,144,255,0);
    }
}

.status {
    margin-top: 20px;
    opacity: 0.8;
    font-size: 14px;
}
</style>
</head>

<body>
<div class="container">
    <button id="micBtn" onclick="toggleMic()">🎙 Start</button>
    <div class="status" id="status">Idle</div>
</div>

<script>
const API_KEY = "{{ api_key }}";
const MODEL = "{{ model }}";

const WS_URL =
`wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${API_KEY}`;

let socket;
let listening = false;

function toggleMic() {
    const btn = document.getElementById("micBtn");
    const status = document.getElementById("status");

    if (!listening) {
        listening = true;
        btn.classList.add("listening");
        btn.innerText = "🎧 Listening";
        status.innerText = "Connecting to Gemini...";

        socket = new WebSocket(WS_URL);

        socket.onopen = () => {
            status.innerText = "Connected (Mic requires HTTPS)";
            socket.send(JSON.stringify({
                setup: {
                    model: MODEL,
                    generation_config: {
                        response_modalities: ["AUDIO"]
                    }
                }
            }));
        };

        socket.onmessage = (e) => {
            console.log("Gemini:", e.data);
        };

        socket.onerror = () => {
            status.innerText = "WebSocket error";
        };

    } else {
        listening = false;
        btn.classList.remove("listening");
        btn.innerText = "🎙 Start";
        status.innerText = "Stopped";

        if (socket) socket.close();
    }
}
</script>

</body>
</html>
